<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轮回坛 战斗观察器</title>
<style>
  body { margin: 0; background: #17130f; color: #e8dcc0; font: 14px/1.5 system-ui, sans-serif; display: flex; gap: 16px; padding: 12px; box-sizing: border-box; height: 100vh; }
  #stage { height: calc(100vh - 24px); aspect-ratio: 720 / 1280; flex: none; }
  #field { width: 100%; height: 100%; border: 1px solid #4a4036; border-radius: 6px; background: #2b2620; }
  #side { flex: 1; min-width: 260px; max-width: 460px; overflow-y: auto; }
  fieldset { border: 1px solid #4a4036; border-radius: 6px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: #f2c84b; }
  button, select, input { background: #2b2620; color: #e8dcc0; border: 1px solid #6a5a48; border-radius: 4px; padding: 3px 8px; font: inherit; }
  button:hover { border-color: #f2c84b; cursor: pointer; }
  .hero { margin: 4px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  td, th { border-bottom: 1px solid #3a3028; padding: 2px 4px; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  #runinfo { margin-bottom: 8px; }
  @media (max-width: 760px) { body { flex-direction: column; height: auto; } #stage { height: auto; width: 100%; } #side { max-width: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="field"></canvas></div>
<div id="side">
  <div id="runinfo"></div>
  <fieldset><legend>控制</legend>
    <button id="pause">暂停</button>
    <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button>
    <button id="next">下一战</button>
  </fieldset>
  <fieldset><legend>英雄（可改道、强制放神通）</legend><div id="heroes"></div></fieldset>
  <fieldset><legend>战报</legend><div id="report">打完一场显示</div></fieldset>
  <fieldset><legend>开局</legend>
    种子 <input id="seed" size="6" value="1">
    <button id="newrun">新一局（3 章 × 8 站）</button>
    <div style="margin-top:8px">
      单场：<select id="chapter"><option value="1">第一章</option><option value="2">第二章</option><option value="3">第三章</option></select>
      第<input id="station" size="2" value="3">站
      <select id="type"><option value="normal">普通</option><option value="elite">精英</option><option value="boss">首领</option></select>
      <select id="boss"></select>
      <select id="affix"></select>
      <button id="single">开打</button>
    </div>
  </fieldset>
</div>
<script src="viewer.js"></script>
</body>
</html>
