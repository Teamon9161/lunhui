let scene='title',setup=null,G=null,modal=null,btns=[],ptr=null,banners=[],toastMsg=null,flash=null;
const SAVE_KEY='lunhui_save_v6',HELP_KEY='lunhui_help_v6';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function loadSave(){const s=store.get(SAVE_KEY);if(!s)return null;try{return JSON.parse(s)}catch(e){return null}}

function toast(s){toastMsg={s,t:1.8}}
const heroById=id=>G.heroes.find(h=>h.id===id);
const hasR=k=>!!G&&G.relics.includes(k);

const fighting=()=>G.phase==='fight';
const lifeOf=d=>LIFE[d]+(hasR('charm')?1:0);

// ================= 英雄 =================
function formOf(h){return HEROES[h.key].forms[h.dao]}
function calcStats(h){
  const D=HEROES[h.key],R=ROLE[D.role],F=formOf(h),M=DAO_MOD[h.dao];
  let g=(1+TUNE.perLife*h.rebirths)*(1+0.1*(h.surv||0))*(D.weak||1);
  let hpG=g,atkG=g*(1+0.08*h.deaths*(h.key==='yuan'?1:0));
  if(h.rebirths>=5)hpG*=1.2;if(h.rebirths>=10)atkG*=1.2;if(h.rebirths>=15){hpG*=1.2;atkG*=1.2}
  if(h.xian){const k=h.xian>=2?2:1.5;hpG*=k;atkG*=k}
  if(G.rally)atkG*=1.2;
  if(hasR('sarira')&&G.heroes.some(x=>x.dao==='fo'))atkG*=1.25;
  if(h.zhuang)atkG*=2;
  const d=h.dao,asura=d==='asura',melee=asura||(F.melee??R.melee);
  const st={emo:F.emo,name:F.name,melee,range:melee?24:(F.range??R.range),
    hp:R.hp*(M.hp||1)*(F.hpMul||1)*hpG,atk:R.atk*(M.atk||1)*(F.atkMul||1)*atkG,cd:R.cd*(M.cd||1)*(F.cdMul||1),spd:R.spd*(M.spd||1),
    heal:F.heal===0||asura?0:(R.heal||0)*(F.healMul||1)*hpG,lifesteal:(M.lifesteal||0)*(F.lsMul||1),drain:hasR('wujian')?0:M.drain||0,taken:M.taken||1,
    taunt:F.taunt||0,guardAura:F.guardAura||0,cleave:F.cleave||(asura&&!R.melee?35:0),stun:F.stun||0,dodge:F.dodge||0,pierce:F.pierce||1,
    regenAura:F.regenAura||0,poison:!!F.poison,crit:F.crit||0,splash:melee?0:(F.splash??R.splash??0),chain:F.chain||(h.zhuang?3:0),frenzy:!!F.frenzy||asura,
    sk:d==='tian'?F.sk||null:null,dash:asura?(F.dashCd||4):0,dashAoe:F.dashAoe||45,dashStun:F.dashStun||0,hunt:d==='ghost',
    aura:d==='hell'?(F.auraR||60)*(hasR('wujian')?1.6:1):0,pet:d==='beast'&&h.key!=='tamer'?(F.pet||'🐾'):null,
    block:F.taunt?4:melee?(R.hp>=300?3:2):1};
  return st;
}
function setStats(h,full){h.st=calcStats(h);const r=h.maxhp?h.hp/h.maxhp:1;h.maxhp=h.st.hp;h.hp=full?h.maxhp:Math.max(1,h.maxhp*r)}
function addHero(key){
  const h={id:G.nextId++,key,name:HEROES[key].name,aff:HEROES[key].aff,dao:'ren',rebirths:0,deaths:0,surv:0,life:1+Math.floor(rnd()*3),
    state:'alive',x:ALTAR.x,y:ALTAR.y-30,ax:ALTAR.x,ay:ALTAR.y-60,hp:0,maxhp:0,atkT:0.3,reviveT:0,shield:0,hits:0,skT:3,dashT:1,dashing:0,auraT:0,retT:0,tgt:null,diedThis:false,toTian:false,zhuang:false,
    xian:0,sac:false,hooked:false,stunT:0};
  setStats(h,true);G.heroes.push(h);layoutAnchors();return h;
}
function layoutAnchors(){
  const mel=G.heroes.filter(h=>calcStats(h).melee),rng=G.heroes.filter(h=>!calcStats(h).melee);
  const place=(list,y)=>list.forEach((h,i)=>{h.ax=list.length===1?210:100+220*i/(list.length-1);h.ay=y});
  place(mel,370);place(rng,440);
}
// 追击半径以阵位为圆心：近战 140、远程射程 +40、修罗 220；饿鬼可以追遍整个下半场
function leashOf(h){return h.dao==='asura'?220:h.st.melee?140:h.st.range+80}
// 远程能打到防线外一点；近战只打贴近防线的
const inLeash=(h,e)=>e.y>=DEF_Y-(h.st.melee?36:110)&&(h.st.hunt||Math.hypot(e.x-h.ax,e.y-h.ay)<=leashOf(h));
function rollDao(h){
  if(h.toTian){h.toTian=false;return'tian'}
  if(hasR('order'))return DAO_ORDER[(DAO_ORDER.indexOf(h.dao)+1)%6];
  const w=DAOS.map(d=>[d,BASE_W[d]*(d===h.aff?2:1)*(G.lockDao===d?5:1)]);
  return wpick(w);
}
const nextOrderDao=h=>DAO_ORDER[(DAO_ORDER.indexOf(h.dao)+1)%6];
const xianAt=k=>XIAN[k]-(hasR('tribul')?5:0);
// 一次转世：source = death（战死）/ life（寿尽）/ early（提前）/ effect（法宝或技能）；noCount = 孟婆汤，不加世数
function rebirth(h,d,source,noCount){
  const prev=h.dao;
  if(!noCount)h.rebirths+=hasR('wheel')?2:1;
  h.dao=d;h.life=lifeOf(d);h.hits=0;
  G.stats.rebirths++;G.stats.by[d]=(G.stats.by[d]||0)+1;if(G.bstat)G.bstat.rebirths++;
  if(hasR('coin'))addMerit(1);
  checkXian(h);
  if(h.xian&&fighting())tribulation(h);
  if(h.key==='scholar'&&!h.zhuang&&h.rebirths>=(hasR('ink')?5:8)){h.zhuang=true;banner('金榜题名！',`${h.name} 中了状元`,C.gold);flash={col:'#e8b44a',t:0.5}}
  if(h.key==='monk'&&h.dao!=='fo'){
    const p=(0.01+0.005*h.rebirths)*(source==='life'?2:1)*(hasR('bodhi')?2:1)*(G.master==='abbot'?2:1)*(G.templeBoost?3:1);
    if(rnd()<p){h.dao='fo';h.life=99;G.stats.buddha++;banner('立地成佛！',`${h.name} 超脱轮回，修成佛陀`,C.gold);flash={col:'#ffd98a',t:0.9}}
  }
  setStats(h,true);if(prev!==h.dao)layoutAnchors();
  return h.dao;
}
function addMerit(n){G.merit+=n;G.stats.merit+=n}
// 世数到了就渡劫：成仙全属性 ×1.5，飞升 ×2；之后每次转世都落天雷
function checkXian(h){
  while(h.xian<2&&h.rebirths>=xianAt(h.xian)){
    h.xian++;G.stats.xian=(G.stats.xian||0)+1;
    banner(h.xian===1?'渡劫成仙！':'白日飞升！',`${h.name} ${h.rebirths} 世${h.xian===1?'，之后每次转世都落天雷':'，天雷翻倍'}`,C.sky);flash={col:'#8fd0ff',t:0.6};
    if(h.st)setStats(h,true);
  }
}
function tribulation(h){
  const fs=G.enemies.filter(hittable).sort((a,b)=>b.hp-a.hp).slice(0,h.xian>=2?6:3);
  if(!fs.length)return;chain(h);
  for(const e of fs){hitEnemy(e,h.st.atk*4,h,{aoe:true,src:'🌩️ 渡劫天雷',death:true});G.fx.push({k:'line',x:e.x+jit(8),y:AR_T,x2:e.x,y2:e.y,t:0.35,m:0.35,col:'#8fd0ff',w:5})}
}
// 连锁：阵亡、复活、转世类效果在 1.5 秒内接连发动就累加
function chain(at){
  if(!G.bstat)return;
  G.chainN=G.chainT>0?G.chainN+1:1;G.chainT=1.5;
  if(G.chainN>G.bstat.chain)G.bstat.chain=G.chainN;
  if(G.chainN>(G.stats.chain||0))G.stats.chain=G.chainN;
  if(G.chainN>=3)G.chainFx={n:G.chainN,t:1.3,x:at?at.x:W/2,y:at?at.y:DEF_Y};
}

// ================= 开局、站点与存档 =================
function newSetup(){RS=(Math.random()*2147483647)|0;setup={master:'abbot',rs:RS}}
function genChapter(ch){
  const n=['battle'];let run=0,rec=false;
  for(let i=1;i<=5;i++){
    let t='battle';
    for(let k=0;k<20;k++){t=wpick([['battle',45],['elite',ch===0&&i<=2?0:12],['recruit',15],['shop',10],['temple',8],['event',10]]);if(!(run>=2&&!['battle','elite'].includes(t)))break}
    run=['battle','elite'].includes(t)?0:run+1;if(t==='recruit')rec=true;n.push(t);
  }
  if(!rec)n[1+Math.floor(rnd()*5)]='recruit';
  n.push(rnd()<0.5?'rest':'shop');n.push('boss');
  return n;
}
// 每章的首领和词缀开局就抽好，开章时公布；纯随机，不看玩家流派
function genBossPlan(ch){
  const boss=pick(CH_INFO[ch].bosses),aff=sample(Object.keys(AFFIX),ch===2?2:1);
  return{boss,aff};
}
function baseRun(){
  return{ch:0,st:0,battles:0,phase:'map',altar:150,altarMax:150,merit:10,heroes:[],relics:[],minions:[],enemies:[],projs:[],fx:[],floats:[],
    spawnQ:[],waves:[],waveT:0,waveNo:0,waveTot:0,pauseT:0,speed:1,nextId:1,altarHitT:0,activeUsed:[false,false,false],kills:0,bookKills:0,
    chainN:0,chainT:0,chainFx:null,bstat:null,lockDao:null,eyeT:0,
    stats:{rebirths:0,deaths:0,kills:0,buddha:0,merit:0,chain:0,xian:0,by:{}},dmgBy:{}};
}
function startRun(){
  RS=setup.rs;
  G=Object.assign(baseRun(),{master:setup.master});
  if(G.master==='escort'){G.altarMax+=60;G.altar+=60}
  G.nodes=[0,1,2].map(genChapter);G.bossPlan=[0,1,2].map(genBossPlan);
  addHero(MASTERS[G.master].start);
  scene='play';banners=[];G.pendingRecruit=2;
  if(!store.get(HELP_KEY)){store.set(HELP_KEY,'1');modal={type:'help',next:()=>openRecruit()}}else openRecruit();
}
const curNode=()=>(G.nodes[G.ch]||[])[G.st]||'boss';
function nextNodeInfo(){let ch=G.ch,st=G.st+1;if(st>=STATIONS){ch++;st=0}return ch<CHAPTERS?{ch,st,type:G.nodes[ch][st]}:null}
function serialize(){
  if(!G||G.phase==='over')return null;
  return{v:6,ch:G.ch,st:G.st,battles:G.battles,altar:G.altar,altarMax:G.altarMax,merit:G.merit,relics:G.relics,master:G.master,nodes:G.nodes,bossPlan:G.bossPlan,lockDao:G.lockDao,
    activeUsed:G.activeUsed,stats:G.stats,dmgBy:G.dmgBy,bookKills:G.bookKills,resume:G.resume||'station',rs:RS,pendingRecruit:G.pendingRecruit||0,
    heroes:G.heroes.map(h=>({key:h.key,aff:h.aff,dao:h.dao,rebirths:h.rebirths,deaths:h.deaths,surv:h.surv,life:h.life,toTian:h.toTian,zhuang:h.zhuang,xian:h.xian,sac:h.sac}))};
}
function saveGame(resume){G.resume=resume||'station';const d=serialize();if(d)store.set(SAVE_KEY,JSON.stringify(d))}
function loadRun(d){
  G=Object.assign(baseRun(),{ch:d.ch,st:d.st,battles:d.battles,altar:d.altar,altarMax:d.altarMax,merit:d.merit,relics:d.relics,master:d.master,nodes:d.nodes,bossPlan:d.bossPlan,lockDao:d.lockDao||null,
    activeUsed:d.activeUsed,stats:d.stats,dmgBy:d.dmgBy||{},bookKills:d.bookKills||0,pendingRecruit:d.pendingRecruit||0});
  for(const o of d.heroes){const h=addHero(o.key);Object.assign(h,o);h.maxhp=0;setStats(h,true)}
  layoutAnchors();RS=d.rs;scene='play';banners=[];
  if(G.pendingRecruit)openRecruit();
  else if(d.resume==='lunhui')openLunhui();
  else goStation();
}
function goStation(){
  if(G.ch>=CHAPTERS){gameOver(true);return}
  G.templeBoost=false;G.phase='map';saveGame('station');
  if(G.st===0&&G.introCh!==G.ch){G.introCh=G.ch;modal={type:'chapter'};return}
  const t=curNode();
  banner(`第${G.ch+1}章 · 第${G.st+1}站`,`${ST_EMO[t]} ${ST_NAME[t]}`,C.gold);
  if(t==='battle'||t==='elite'||t==='boss')startBattle(t);
  else if(t==='recruit')openRecruit();
  else if(t==='shop')openShop();
  else if(t==='temple')modal={type:'temple'};
  else if(t==='event')openEvent();
  else if(t==='rest'){const v=Math.round(G.altarMax*0.5);G.altar=Math.min(G.altarMax,G.altar+v);modal={type:'info',title:'⛺ 休整',lines:[`法坛修复 ${v} 点。`,`现在 ${Math.ceil(G.altar)} / ${G.altarMax}`],next:advance}}
}
function advance(){
  modal=null;G.st++;
  if(G.st>=STATIONS){G.st=0;G.ch++;if(G.ch<CHAPTERS){G.altar=Math.min(G.altarMax,G.altar+40);banner(`第${G.ch+1}章`,'法坛修复 40',C.gold)}}
  if(G.ch>=CHAPTERS){gameOver(true);return}
  goStation();
}
function gameOver(win){G.phase='over';store.del(SAVE_KEY);modal={type:'over',win};if(win)flash={col:'#e8b44a',t:0.8}}

// ---- 招募 ----
function openRecruit(){
  const owned=new Set(G.heroes.map(h=>h.key));
  const pool=ROSTER.filter(k=>!owned.has(k)).map(k=>[k,1]);
  // 英雄都招齐了：改成历练，一位英雄世数 +2
  if(!pool.length){modal={type:'pickHero',title:'英雄已招齐 · 历练：选一位世数 +2',fn:h=>{h.rebirths+=2;checkXian(h);setStats(h,true);toast(`${h.name} 世数 +2`)},
    after:recruitDone,skip:'不历练（香火 +10）',onSkip:()=>{addMerit(10);recruitDone()}};return}
  modal={type:'recruit',offer:wsample(pool,3)};
}
function recruit(key){
  if(G.heroes.length>=cap()){modal={type:'release',incoming:key};return}
  addHero(key);banner('新英雄',`${HEROES[key].forms.ren.emo} ${HEROES[key].name} 加入`,C.jade);recruitDone();
}
const releaseValue=h=>6+2*h.rebirths;
function release(h,incoming){
  addMerit(releaseValue(h));G.heroes=G.heroes.filter(x=>x!==h);
  if(incoming){addHero(incoming);banner('换人',`${h.name} 离队，${HEROES[incoming].name} 加入`,C.jade)}
  layoutAnchors();recruitDone();
}
function recruitDone(){
  modal=null;
  if(G.pendingRecruit>0){G.pendingRecruit--;if(G.pendingRecruit>0){openRecruit();return}goStation();return}
  advance();
}
// ---- 商店 ----
function openShop(){
  const owned=new Set(G.heroes.map(h=>h.key));
  const heroes=sample(ROSTER.filter(k=>!owned.has(k)),2);
  const relics=relicOffer(3);
  modal={type:'shop',items:[...heroes.map(k=>({kind:'hero',k,price:40})),...relics.map(k=>({kind:'relic',k,price:50})),{kind:'extend',price:COST.extend},{kind:'repair',price:15}]};
}
function buyItem(it){
  if(it.sold||G.merit<it.price)return;
  if(it.kind==='extend'){modal={type:'pickHero',title:'续命：选一位英雄（寿元 +1）',back:modal,fn:h=>{G.merit-=it.price;h.life++;it.sold=true;toast(`${h.name} 寿元 +1`)}};return}
  G.merit-=it.price;it.sold=true;
  if(it.kind==='hero'){const m=modal;if(G.heroes.length>=cap()){modal={type:'release',incoming:it.k,back:m};return}addHero(it.k);toast(`${HEROES[it.k].name} 加入`)}
  else if(it.kind==='relic')gainRelic(it.k);
  else if(it.kind==='repair'){G.altar=Math.min(G.altarMax,G.altar+40);toast('法坛 +40')}
}

// 一场 2–3 波（第一章 2 波），波间停 2 秒；精英和首领在最后一波出场
function buildWaves(type){
  const b=G.battles,info=CH_INFO[G.ch],nW=G.ch===0?2:3,inCh=G.st;
  const budget=(TUNE.budgetBase+TUNE.budgetStep*b)*(type==='elite'?0.75:type==='boss'?0.6:1);
  const pool=info.pool.map(([k,w,min])=>[k,inCh>=min?w:0]);
  const waves=[];
  for(let w=0;w<nW;w++){
    const q=[];let left=budget/nW*(w===nW-1?1.25:0.9);
    while(left>0){const t=wpick(pool);q.push({type:t,t:0.5+rnd()*10});left-=ENEMY[t].cost}
    waves.push(q);
  }
  const lastW=waves[nW-1];
  if(type==='elite')lastW.push({type:pick(info.elite),t:3,elite:true,aff:[pick(['rage','split','soul','horde'])]});
  if(type==='boss'){const P=G.bossPlan[G.ch];lastW.push({type:P.boss,t:3,aff:P.aff});if(P.boss==='hei')lastW.push({type:'bai',t:3.5,aff:P.aff})}
  for(const q of waves)q.sort((a,b)=>a.t-b.t);
  return waves;
}
function startBattle(type){
  G.phase='fight';G.btype=type;G.waveT=0;G.waves=buildWaves(type);G.waveTot=G.waves.length;G.waveNo=1;G.spawnQ=G.waves.shift();G.pauseT=0;
  G.curComp=[G.spawnQ,...G.waves].flat();
  G.enemies=[];G.projs=[];G.minions=[];G.fx=[];G.chainN=0;G.chainT=0;G.chainFx=null;G.eyeT=0;
  G.bstat={dmg:{},kills:{},deaths:0,rebirths:0,chain:0};
  for(const h of G.heroes){h.diedThis=false;h.state='alive';h.shield=0;h.reviveT=0;h.stunT=0;h.hooked=false;h.x=h.ax+jit(10);h.y=h.ay+40;h.tgt=null;h.retT=0;h.skT=3;h.dashT=1;h.dashing=0;h.auraT=0;setStats(h,true)}
  for(const h of G.heroes){if(h.key==='tamer')summonPets(h,h.dao==='beast'?3:1);petUp(h)}
}
// 献祭：轮回台上标记的英雄，第一波敌人逼近时自尽，走一遍完整的阵亡流程
function sacrificeTick(){
  for(const h of G.heroes){
    if(!h.sac||h.state!=='alive')continue;
    const near=G.enemies.filter(e=>hittable(e)&&dist(e,h)<=150).length;
    if(near>=3||(G.waveNo===1&&G.waveT>9)){
      h.sac=false;G.bstat.sac=(G.bstat.sac||0)+1;
      G.floats.push({x:h.x,y:h.y-30,s:'献祭！',col:C.red,t:1.4});G.fx.push({k:'pillar',x:h.x,y:h.y,t:0.6,m:0.6,col:'#e0573f'});
      heroDie(h,null);h.reviveT=Math.min(h.reviveT,3);
    }
  }
}
function summonPets(h,n,ttl){
  const mul=h.dao==='tian'?2:1;
  for(let k=0;k<n;k++)spawnMinion(h,{emo:'🐺',hp:h.maxhp*0.6,atk:h.st.atk*0.5*mul,cd:0.8,ttl:ttl||999,spd:80,pet:true,hunt:h.dao==='ghost'});
}
// 畜生道兽伴：每位英雄同时最多一只
function petUp(h){
  if(!h.st.pet||G.minions.some(m=>m.owner===h.id&&m.pet&&!m.dead))return;
  spawnMinion(h,{emo:h.st.pet,hp:h.maxhp*0.45,atk:h.st.atk*0.55,cd:0.8,ttl:999,spd:85,pet:true});

function battleEnd(){
  G.phase='post';G.battles++;
  const t=G.btype,gain=t==='boss'?20:t==='elite'?12:6+2*G.ch;addMerit(gain);
  if(hasR('incense'))addMerit(6);

    if(h.key==='shou'){h.surv=h.diedThis?0:(h.surv||0)+1}
    if(h.dao!=='fo')h.life--;
    if(h.state!=='alive'){h.state='alive'}
    h.maxhp=0;setStats(h,true);
  }
  G.minions=[];G.enemies=[];G.projs=[];

  else if(t==='elite')next=()=>{modal={type:'relicPick',offer:relicOffer(3),title:'精英战利品'}};
  modal={type:'report',next};
}

// ---- 敌人 ----
function spawnEnemy(item){
  const d=ENEMY[item.type],b=G.battles,hpS=Math.pow(TUNE.hpGrowth,b),atkS=Math.pow(TUNE.atkGrowth,b);
  // 只从顶部出生，横向随机；首领从正中
  const x=d.boss?(d.boss==='bai'?W/2+60:d.boss==='hei'?W/2-60:W/2):30+rnd()*360,y=AR_T+14;
  const el=item.elite?{hp:5,atk:1.6,size:1.35}:{hp:1,atk:1,size:1};
  const aff=item.aff||[];
  const e={type:item.type,name:aff.map(a=>AFFIX[a].name).join('')+(aff.length?'·':'')+(item.elite?'精英':'')+d.name,emo:d.emo,x,y,hp:d.hp*hpS*el.hp,atk:d.atk*atkS*el.atk,cd:d.cd,spd:d.spd,range:d.range,
    altar:d.altar*(item.elite?2:1),size:d.size*el.size,ranged:!!d.ranged,assassin:!!d.assassin,mole:!!d.mole,boss:d.boss||null,elite:!!item.elite,splash:d.splash||0,reform:!!d.reform,
    aff,atkT:0.8,retT:0,tgt:null,slowT:0,stunT:0,poisonT:0,poisonD:0,flash:0,skT:4,sumT:6,hordeT:4,dogT:2,phase:0,leapt:false,hitBy:null,hitByT:0,under:false,saw:false,air:0,lift:0,collapse:0};
  e.maxhp=e.hp;e.id=(G.eid=(G.eid||0)+1);G.enemies.push(e);
  if(aff.includes('guard'))for(let k=0;k<2;k++){const g=spawnEnemy({type:pick(CH_INFO[G.ch].elite),elite:true});g.x=x+(k?50:-50);g.y=y+10}
  return e;
}
// 钻地、扑跃、散架中的敌人打不到
const hittable=e=>!e.dead&&!e.under&&!(e.air>0)&&!(e.collapse>0);
const hasAff=(k)=>G.enemies.some(e=>!e.dead&&e.aff.includes(k));
function stunHero(a,t){if(a.minion)return;a.stunT=Math.max(a.stunT||0,t);a.dashing=0}
function knock(a,dx,dy){a.x=clamp(a.x+dx,10,W-10);a.y=clamp(a.y+dy,DEF_Y,AR_B-8)}
const allyAlive=a=>a.minion?!a.dead:a.state==='alive';
function allies(){return[...G.heroes.filter(h=>h.state==='alive'),...G.minions.filter(m=>!m.dead)]}
// 近战英雄能拦住的敌人数：嘲讽 4，坦克 3，其他近战 2，远程和小兽 1
const capOf=a=>a.minion?1:a.st.block;
function engaged(a){let n=0;for(const e of G.enemies)if(!e.dead&&e.tgt===a&&!e.ranged&&!e.boss)n++;return n}
function nearestAlly(e,r,ok){let best=null,bd=r;for(const a of allies()){const d=dist(a,e);if(d<bd&&(!ok||ok(a))){bd=d;best=a}}return best}
function enemyTarget(e){
  if(e.under)return'altar';
  const cur=e.tgt;
  if(e.boss)return nearestAlly(e,230)||'altar';
  if(e.ranged)return nearestAlly(e,e.range+60)||'altar';
  if(e.assassin){let best=null,by=-1;for(const h of G.heroes)if(h.state==='alive'&&!h.st.melee&&h.y>by&&dist(h,e)<300){by=h.y;best=h}if(best)return best}
  // 正在交手就不换；被近身打了就还手
  if(cur&&cur!=='altar'&&allyAlive(cur)&&dist(e,cur)<=e.range+30)return cur;
  if(e.hitByT>0&&e.hitBy&&allyAlive(e.hitBy)&&dist(e,e.hitBy)<70)return e.hitBy;
  // 先被嘲讽吸走，再找附近还拦得住人的英雄；都满了就绕过去冲法坛
  const taunt=nearestAlly(e,140,a=>!a.minion&&a.st.taunt&&(a===cur||engaged(a)<capOf(a)));if(taunt)return taunt;
  return nearestAlly(e,110,a=>a===cur||engaged(a)<capOf(a))||'altar';
}
function hurtAlly(a,d,e){
  if(a.minion){a.hp-=d;if(a.hp<=0)a.dead=true;return}
  const h=a;
  if(h.st.dodge&&Math.random()<h.st.dodge){G.floats.push({x:h.x,y:h.y-20,s:'闪',col:C.sky,t:0.6});return}
  d*=h.st.taken;
  if(hasR('mirror')&&h.st.melee)d*=0.75;
  if(G.eyeT>0)d*=1.2;
  const ga=G.heroes.find(g=>g!==h&&g.state==='alive'&&g.st.guardAura&&dist(g,h)<=90);if(ga)d*=1-ga.st.guardAura;
  if(h.shield>0){const s=Math.min(h.shield,d);h.shield-=s;d-=s}
  h.hp-=d;h.hitT=0.12;
  if(h.hp<=0)heroDie(h,e);
}
function burrow(e){e.under=true;e.tgt='altar';G.fx.push({k:'ring',x:e.x,y:e.y,r:22,t:0.4,m:0.4,col:'#9c7440'});G.floats.push({x:e.x,y:e.y-18,s:'钻地',col:'#c9a36a',t:1})}
function surface(e){e.under=false;e.retT=0;G.fx.push({k:'ring',x:e.x,y:e.y,r:26,t:0.4,m:0.4,col:'#9c7440'});G.floats.push({x:e.x,y:e.y-18,s:'钻出',col:'#c9a36a',t:0.8})}
function leap(e,t){e.air=0.45;e.lx0=e.x;e.ly0=e.y;e.lx1=t.x+jit(12);e.ly1=t.y+16;G.floats.push({x:e.x,y:e.y-20,s:'扑！',col:'#e0745f',t:0.8})}
function enemyTick(e,dt){
  if(e.flash>0)e.flash-=dt;if(e.slowT>0)e.slowT-=dt;if(e.hitByT>0)e.hitByT-=dt;
  if(e.poisonT>0){e.poisonT-=dt;e.hp-=e.poisonD*dt;if(e.hp<=0){killEnemy(e,null);return}}
  if(e.air>0){
    e.air-=dt;const k=1-Math.max(0,e.air)/0.45;e.x=e.lx0+(e.lx1-e.lx0)*k;e.y=e.ly0+(e.ly1-e.ly0)*k;e.lift=Math.sin(k*Math.PI)*36;
    if(e.air<=0){e.air=0;e.lift=0;e.atkT=0.2;G.fx.push({k:'ring',x:e.x,y:e.y,r:20,t:0.3,m:0.3,col:'#e0745f'})}
    return;
  }
  if(e.collapse>0){e.collapse-=dt;if(e.collapse<=0){e.hp=e.maxhp*0.5;G.floats.push({x:e.x,y:e.y-18,s:'重组',col:'#d6cdbd',t:0.9})}return}
  if(e.charge){chargeTick(e,dt);return}
  if(e.stunT>0){e.stunT-=dt;return}
  if(e.under){moveToward(e,ALTAR.x,ALTAR.y,e.spd*1.8*dt);if(dist(e,ALTAR)<=ALTAR.r+34)surface(e);return}
  if(e.aff.length)affixTick(e,dt);
  if(e.boss)bossTick(e,dt);
  e.atkT-=dt;e.retT-=dt;
  if(e.tgt&&e.tgt!=='altar'&&!allyAlive(e.tgt))e.retT=0;
  if(e.retT<=0){
    e.retT=0.4;e.tgt=enemyTarget(e);
    // 遁地鼠第一次撞见英雄时，一半机会钻地绕到法坛
    if(e.mole&&!e.saw&&nearestAlly(e,90)){e.saw=true;if(rnd()<0.5){burrow(e);return}}
    // 夜叉盯上后排、距离合适时，有一次机会扑进去
    if(e.assassin&&!e.leapt&&e.tgt!=='altar'&&!e.tgt.minion&&!e.tgt.st.melee){const d=dist(e,e.tgt);if(d<170&&d>50){e.leapt=true;if(rnd()<0.5){leap(e,e.tgt);return}}}
  }
  // 一波拖太久，还在防线外的敌人直接压向法坛，防止僵持
  if(G.waveT>40&&e.y<DEF_Y-25&&!e.boss)e.tgt='altar';
  const t=e.tgt,isAltar=t==='altar';
  const tx=isAltar?ALTAR.x:t.x,ty=isAltar?ALTAR.y:t.y,reach=isAltar?ALTAR.r+Math.min(e.range,24):e.range+12;
  const d=Math.hypot(tx-e.x,ty-e.y),spd=e.spd*(e.slowT>0?0.6:1)*dt;
  // 远程敌人要先走到防线跟前才开火，不能站在英雄够不着的地方一直射
  if(e.ranged&&!isAltar&&e.y<DEF_Y-25)moveToward(e,e.x+(tx-e.x)*0.2,DEF_Y-20,spd);
  else if(d>reach)moveToward(e,tx,ty,spd);
  else if(e.atkT<=0){
    e.atkT=e.cd;e.atkAnim=0.25;e.face=tx<e.x?-1:1;
    if(isAltar){const v=e.altar*(1+0.3*G.ch)*(hasR('barrier')?0.7:1);G.altar-=v;G.dmgBy[e.name]=(G.dmgBy[e.name]||0)+v;G.altarHitT=0.3}
    else{
      if(e.ranged)G.fx.push({k:'line',x:e.x,y:e.y,x2:t.x,y2:t.y,t:0.15,m:0.15,col:e.splash?'#9fc4ff':'#e0745f'});
      if(e.splash){for(const a of allies())if(a!==t&&dist(a,t)<=e.splash)hurtAlly(a,e.atk*0.6,e);G.fx.push({k:'ring',x:t.x,y:t.y,r:e.splash,t:0.25,m:0.25,col:'#9fc4ff'})}
      hurtAlly(t,e.atk,e);
    }
  }
}

function affixTick(e,dt){

    G.floats.push({x:e.x,y:e.y-e.size*0.7,s:'分魂！',col:C.violet,t:1.2});G.fx.push({k:'ring',x:e.x,y:e.y,r:40,t:0.4,m:0.4,col:C.violet});
  }

}

  if(e.skT>0)return;

// 牛魔冲撞：直线冲 0.45 秒，路上的英雄被撞开、撞晕
function chargeTick(e,dt){
  const c=e.charge;c.t-=dt;e.x=clamp(e.x+c.vx*dt,20,W-20);e.y=clamp(e.y+c.vy*dt,AR_T+10,AR_B-30);

function hitEnemy(e,d,h,opt){
  if(e.dead)return;
  const aoe=opt&&opt.aoe;
  if(h){
    if(h.st.lifesteal&&h.state==='alive')h.hp=Math.min(h.maxhp,h.hp+d*h.st.lifesteal);
    const stun=(opt&&opt.stun)||(!aoe&&h.st.stun&&Math.random()<h.st.stun?0.6:0);
    if(stun)e.stunT=Math.max(e.stunT,stun*(e.boss?0.3:1));
    if(h.st.poison&&!aoe){e.poisonT=4;e.poisonD=e.maxhp*(e.boss?0.006:0.03)}
    if(h.st.melee&&!aoe){e.hitBy=h;e.hitByT=1}
  }
  if(e.mole&&!e.saw&&!e.under){e.saw=true;if(rnd()<0.5)burrow(e)}
  // 本场贡献：按来源记实际打掉的血
  const src=(opt&&opt.src)||(h?(h.minion?(heroById(h.owner)||{}).name+'·兽伴':h.name):'其他'),real=Math.min(d,Math.max(0,e.hp));
  if(G.bstat)G.bstat.dmg[src]=(G.bstat.dmg[src]||0)+real;
  e.hp-=d;e.flash=0.1;
  if(e.hp<=0)killEnemy(e,h,src,opt&&opt.death);
}
// death = 这次击杀来自阵亡、复活、转世类效果（尸爆符、往生咒只认这类）
function killEnemy(e,h,src,death){
  if(e.dead)return;
  if(e.reform&&!e.reformed){e.reformed=true;e.collapse=2;e.hp=0;e.emo='🦴';G.floats.push({x:e.x,y:e.y-18,s:'散架',col:'#d6cdbd',t:0.8});return}

    if(hasR('chant')){let n=0;for(const x of G.heroes)if(x.state==='dead'){x.reviveT=Math.max(0.2,x.reviveT-1);n++}if(n)G.floats.push({x:e.x,y:e.y-14,s:'往生 -1秒',col:'#f5b8d0',t:0.8})}
  }

  if(e.boss){banner(`${e.name}伏诛`,'',C.gold);flash={col:'#e8b44a',t:0.4}}

// ---- 英雄行动、死亡与复活 ----
// 目标评分（越小越优先）：默认就近，帮队友和拦冲法坛的；修罗扑大个，饿鬼追残血
function heroScore(h,e){
  const d=dist(h,e);
  if(h.st.hunt)return e.hp*0.5+d*0.4;
  let s=d;
  if(h.dao==='asura')s-=Math.min(140,e.maxhp*0.12);
  if(e.tgt===h)s-=70;
  else if(e.tgt&&e.tgt!=='altar')s-=30;
  else if(e.tgt==='altar')s-=Math.max(0,180-dist(e,ALTAR)*0.5);
  if(!h.st.melee&&d<=h.st.range)s-=60;
  return s;
}
// 只在追击半径内挑目标；目标跑出半径就放弃，回阵位
function pickTarget(h){
  let best=null,bs=1e9;
  for(const e of G.enemies){if(!hittable(e)||!inLeash(h,e))continue;const s=heroScore(h,e);if(s<bs){bs=s;best=e}}
  if(h.tgt&&hittable(h.tgt)&&inLeash(h,h.tgt)&&best!==h.tgt&&heroScore(h,h.tgt)<bs+50)return h.tgt;
  return best;
}
function heroTick(h,dt){
  const st=h.st;
  if(h.hitT>0)h.hitT-=dt;if(h.furyT>0)h.furyT-=dt;if(h.dashT>0)h.dashT-=dt;
  if(st.drain){G.altar-=st.drain*dt;G.dmgBy['地狱道形态']=(G.dmgBy['地狱道形态']||0)+st.drain*dt}
  if(h.dao==='hell'&&hasR('wujian')){h.hp-=h.maxhp*0.04*dt;if(h.hp<=0){heroDie(h,null);return}}
  if(h.stunT>0){h.stunT-=dt;return}
  if(st.regenAura)for(const a of G.heroes)if(a.state==='alive'&&dist(a,h)<=110)a.hp=Math.min(a.maxhp,a.hp+st.regenAura*a.maxhp*dt);
  if(st.sk){h.skT-=dt;if(h.skT<=0&&G.enemies.some(hittable)){h.skT=7;castSkill(h)}}
  if(st.aura){h.auraT-=dt;if(h.auraT<=0){h.auraT=0.5;const k=hasR('wujian')?0.6:0.3;for(const e of G.enemies)if(hittable(e)&&dist(e,h)<=st.aura)hitEnemy(e,st.atk*k,h,{aoe:true})}}
  h.atkT-=dt;
  if(h.dashing>0){
    const t=h.tgt;h.dashing-=dt;
    if(!t||!hittable(t))h.dashing=0;
    else{moveToward(h,t.x,t.y,640*dt);if(h.y<DEF_Y)h.y=DEF_Y;if(dist(h,t)<=st.range+t.size*0.4||h.dashing<=0){h.dashing=0;dashLand(h)}}
    return;
  }
  let tgt=null,heal=false;
  if(st.heal){let bp=0.9;for(const a of G.heroes){if(a.state!=='alive')continue;const p=a.hp/a.maxhp;if(p<bp&&dist(a,h)<=st.range*1.6){bp=p;tgt=a}}if(tgt)heal=true}
  if(!tgt){h.retT-=dt;if(h.retT<=0||!h.tgt||!hittable(h.tgt)||!inLeash(h,h.tgt)){h.retT=0.4;h.tgt=pickTarget(h)}tgt=h.tgt}
  if(tgt){
    const reach=heal?st.range:st.range+(tgt.size||0)*0.4,d=dist(h,tgt);
    if(d>reach){
      if(!heal&&st.dash&&h.dashT<=0&&d>70&&d<280){h.dashT=st.dash;h.dashing=0.45;h.dx0=h.x;h.dy0=h.y}
      else moveToward(h,tgt.x,tgt.y,st.spd*dt);
    }else if(h.atkT<=0){h.atkT=st.cd*(st.frenzy?Math.max(0.5,1-0.04*h.hits):1)*(h.furyT>0?0.625:1);heal?doHeal(h,tgt):heroAttack(h,tgt)}
  }else moveToward(h,h.ax,h.ay,st.spd*dt);
  if(h.y<DEF_Y)h.y=DEF_Y;
}
// 修罗冲锋落地：拖出一道红痕，炸开一圈
function dashLand(h){

      let nb=null,nd=140;for(const e of fs){if(e.dead||hit.includes(e))continue;const d=Math.hypot(e.x-px,e.y-py);if(d<nd){nd=d;nb=e}}cur=nb}

function doHeal(h,a){
  const amt=Math.min(h.st.heal,a.maxhp-a.hp);a.hp+=amt;

function heroAttack(h,t){
  const st=h.st;h.hits++;let dmg=st.atk;h.atkAnim=0.25;h.face=t.x<h.x?-1:1;
  if(st.crit&&Math.random()<st.crit){dmg*=2.5;G.floats.push({x:t.x,y:t.y-18,s:'暴击',col:C.gold,t:0.6})}

    if(st.cleave)for(const e of G.enemies)if(e!==t&&hittable(e)&&dist(e,t)<=st.cleave)hitEnemy(e,dmg*0.6,h,{aoe:true});
    G.fx.push({k:'slash',x:t.x,y:t.y,t:0.15,m:0.15,col:h.dao==='asura'?'#ff7a5a':'#f0e6d0'});

      if(st.splash)for(const e of G.enemies)if(e!==cur&&hittable(e)&&dist(e,cur)<=st.splash)hitEnemy(e,dmg*0.4,h,{aoe:true});
      let nb=null,nd=90;for(const e of G.enemies){if(!hittable(e)||hit.includes(e))continue;const d=Math.hypot(e.x-px,e.y-py);if(d<nd){nd=d;nb=e}}cur=nb;if(nb)hit.push(nb)}

  }
  const targets=[t];

function heroDie(h,killer){

// ================= 主循环（模拟） =================
function step(dt){
  if(!G||G.phase!=='fight')return;
  G.waveT+=dt;while(G.spawnQ.length&&G.spawnQ[0].t<=G.waveT)spawnEnemy(G.spawnQ.shift());
  if(G.chainT>0)G.chainT-=dt;if(G.chainFx){G.chainFx.t-=dt;if(G.chainFx.t<=0)G.chainFx=null}
  if(G.eyeT>0)G.eyeT-=dt;
  G.corpseT=(G.corpseT||0)-dt;if(G.corpseT<=0){G.corpseT=1;G.corpseN=0}
  sacrificeTick();
  for(const h of G.heroes){
    if(h.state==='dead'){h.reviveT-=dt;if(h.reviveT<=0)revive(h)}
    else heroTick(h,dt);
  }
  for(const m of G.minions)if(!m.dead)minionTick(m,dt);
  for(const e of G.enemies)if(!e.dead)enemyTick(e,dt);
  G.zapT=(G.zapT||0)-dt;
  if(G.zapT<=0){let t=null,bd=ALTAR.r+60;for(const e of G.enemies){const d=dist(e,ALTAR);if(hittable(e)&&d<bd){bd=d;t=e}}
    if(t){G.zapT=1;hitEnemy(t,14*Math.pow(1.12,G.battles),null,{src:'☸ 法坛'});G.fx.push({k:'line',x:ALTAR.x,y:ALTAR.y,x2:t.x,y2:t.y,t:0.15,m:0.15,col:'#f3d27a'})}}
  for(const p of G.projs){
    if(p.done)continue;if(!hittable(p.t)){p.done=true;continue}
    const dx=p.t.x-p.x,dy=p.t.y-p.y,d=Math.hypot(dx,dy),v=480*dt;
    if(d<=v+6){p.done=true;hitEnemy(p.t,p.dmg,p.src);
      if(p.splash){for(const e of G.enemies)if(e!==p.t&&hittable(e)&&dist(e,p.t)<=p.splash)hitEnemy(e,p.dmg*0.6,p.src,{aoe:true});G.fx.push({k:'ring',x:p.t.x,y:p.t.y,r:p.splash,t:0.25,m:0.25,col:'#f3d27a'})}}
    else{p.x+=dx/d*v;p.y+=dy/d*v}
  }
  separate([...G.heroes.filter(h=>h.state==='alive'&&!(h.dashing>0)),...G.minions.filter(m=>!m.dead)],16,DEF_Y);
  separate(G.enemies.filter(hittable),18);
  // 动作状态：朝向、是否在走、出手动画计时
  for(const u of [...G.heroes,...G.enemies,...G.minions]){
    const dx=u.x-(u.px??u.x),dy=u.y-(u.py??u.y);u.moving=Math.hypot(dx,dy)>12*dt;
    if(Math.abs(dx)>6*dt&&!(u.atkAnim>0))u.face=Math.sign(dx);u.px=u.x;u.py=u.y;if(u.atkAnim>0)u.atkAnim-=dt;
  }
  for(const f of G.fx)f.t-=dt;for(const f of G.floats){f.t-=dt;f.y-=18*dt}
  if(G.altarHitT>0)G.altarHitT-=dt;
  G.enemies=G.enemies.filter(e=>!e.dead);G.minions=G.minions.filter(m=>!m.dead);G.projs=G.projs.filter(p=>!p.done);
  G.fx=G.fx.filter(f=>f.t>0);G.floats=G.floats.filter(f=>f.t>0);
  if(G.altar<=0){G.altar=0;gameOver(false);return}
  if(!G.spawnQ.length&&!G.enemies.length){
    if(!G.waves.length){battleEnd();return}
    // 波间停 2 秒
    if(G.pauseT<=0){G.pauseT=2;G.floats.push({x:W/2,y:DEF_Y-40,s:`第 ${G.waveNo+1} 波`,col:C.gold,t:1.8})}
    else{G.pauseT-=dt;if(G.pauseT<=0){G.spawnQ=G.waves.shift();G.waveNo++;G.waveT=0}}
  }
}
function separate(list,r,minY){
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>0&&d<r){const p=(r-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}}
  for(const o of list){o.x=clamp(o.x,10,W-10);o.y=clamp(o.y,minY||AR_T+8,AR_B-8)}
}

function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
// 按亮度映射到两端颜色，再与原色混合
function recolor(img,lo,hi,mix,sat,alpha){
  const c=cvs(img.width,img.height),x=c.getContext('2d');x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;let r=p[i],g=p[i+1],b=p[i+2];const L=(0.3*r+0.59*g+0.11*b)/255;
    if(sat!==1){const m=L*255;r=m+(r-m)*sat;g=m+(g-m)*sat;b=m+(b-m)*sat}
    r+=(lo[0]+(hi[0]-lo[0])*L-r)*mix;g+=(lo[1]+(hi[1]-lo[1])*L-g)*mix;b+=(lo[2]+(hi[2]-lo[2])*L-b)*mix;
    p[i]=r;p[i+1]=g;p[i+2]=b;if(alpha!==1)p[i+3]*=alpha;
  }
  x.putImageData(d,0,0);return c;
}

function drawSprite(k,x,y,hp,o={}){
  const s=SPR[k];if(!s)return false;
  const sc=hp/s.h,w=s.w*sc,h=hp,dx=-s.cx*sc,dy=-h;
  ctx.save();ctx.translate(x,y);if(o.lean)ctx.rotate(o.lean);ctx.scale((o.flip?-1:1)*(o.sx||1),o.sy||1);
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(o.outline){const ol=variant(k,o.outline),r=Math.max(1,hp/38);ctx.save();if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=hp*0.2}
    for(const [ox,oy] of [[-r,0],[r,0],[0,-r],[0,r]])ctx.drawImage(ol,dx+ox,dy+oy,w,h);ctx.restore()}
  ctx.drawImage(variant(k,o.tint),dx,dy,w,h);

}

    wrapText(B.mech,nx,310,W-nx-44,15,FONT(11),C.dim);
    let y=366;txt('词缀',44,y,FONT(12,'bold'),C.red);y+=24;
    for(const a of P.aff){rr(40,y-12,W-80,40,8);ctx.fillStyle=C.panel2;ctx.fill();txt(AFFIX[a].name,56,y+8,FONT(14,'bold'),C.violet);txt(AFFIX[a].desc,110,y+8,FONT(11),C.ink);y+=48}
    txt('首领和词缀纯随机抽取，用这一章的招募和法宝去应对。',W/2,524,FONT(11),C.dim,'center');
    button(60,540,W-120,32,m.view?'关闭':'出发',()=>{modal=null;if(!m.view)goStation()},{bg:C.gold,col:'#1a1208'});
  }else if(m.type==='report'){
    // 战报：本场各来源的伤害和击杀
    const b=G.bstat,rows=Object.entries(b.dmg).sort((x,y)=>y[1]-x[1]).slice(0,8),tot=rows.reduce((s,r)=>s+r[1],0)||1;block();
    panel(16,90,W-32,520);
    txt('战报',W/2,124,DFONT(30),C.gold,'center');
    txt(`香火 +${G.lastGain}  ·  阵亡 ${b.deaths}  ·  转世 ${b.rebirths}${b.sac?`  ·  献祭 ${b.sac}`:''}`,W/2,154,FONT(11),C.dim,'center');
    txt(`最长连锁 ×${b.chain}`,W/2,178,FONT(14,'bold'),b.chain>=3?C.gold:C.dim,'center');
    let y=206;
    for(const [k,v] of rows){
      const hero=G.heroes.find(h=>h.name===k),col=hero?DAO_COL[hero.dao]:k.includes('·')?'#ff9a5a':C.violet;
      txt(k,32,y,FONT(12,'bold'),C.ink);txt(`${Math.round(v)}${b.kills[k]?` · 杀${b.kills[k]}`:''}`,W-32,y,FONT(11),C.dim,'right');
      bar(32,y+10,W-64,6,v/rows[0][1],col,'rgba(255,255,255,.06)');txt(`${Math.round(v/tot*100)}%`,W-32,y+13,FONT(9),C.dim,'right');y+=38;
    }
    if(!rows.length)txt('这场没打出伤害',W/2,y,FONT(12),C.dim,'center');
    button(60,560,W-120,38,'继续',()=>{const n=m.next;modal=null;n()},{bg:C.gold,col:'#1a1208'});
  }else if(m.type==='pickDao'){
    block();panel(20,150,W-40,420);
    txt('锁道：选一道',W/2,186,FONT(17,'bold'),C.gold,'center');txt('之后所有转世进这一道的机会 ×5',W/2,210,FONT(11),C.dim,'center');

      txt(DAO_NAME[d],56,y+16,FONT(14,'bold'),DAO_COL[d]);txt(DAO_RULE[d],56,y+34,FONT(10),C.dim)});
  }else if(m.type==='over'){
    panel(20,90,W-40,580);block();const s=G.stats;

    const worst=Object.entries(G.dmgBy).sort((a,b)=>b[1]-a[1])[0];
    const rows=[['转世 / 阵亡',`${s.rebirths} / ${s.deaths}`],['最长连锁',`×${s.chain||0}`],['渡劫 / 成佛',`${s.xian||0} / ${s.buddha}`],['击杀',s.kills],['法宝',G.relics.map(k=>RELICS[k].emo).join('')||'无'],['法坛最大威胁',worst?`${worst[0]}（${Math.round(worst[1])}）`:'无']];

    button(50,604,W-100,46,'再开一坛',()=>{modal=null;scene='title';newSetup()},{bg:C.gold,col:'#1a1208',font:DFONT(24)});
  }
}

// ================= 主循环与输入 =================
function render(){
  btns.length=0;
  if(scene==='title')renderTitle();else renderPlay();
  if(flash){ctx.globalAlpha=clamp(flash.t,0,1)*0.5;ctx.fillStyle=flash.col;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  const b=banners[0];
  if(b&&scene==='play'&&!modal){const a=Math.min(1,b.t/0.4,(2-b.t)/0.2);ctx.globalAlpha=Math.max(0,a);
    rr(30,130,W-60,b.sub?70:50,12);ctx.fillStyle='rgba(12,9,16,.82)';ctx.fill();
    txt(b.text,W/2,156,DFONT(28),b.col,'center');if(b.sub)txt(b.sub,W/2,184,FONT(12),C.ink,'center');ctx.globalAlpha=1}
  if(modal)renderModal();
  if(toastMsg){ctx.globalAlpha=Math.min(1,toastMsg.t*2);ctx.font=FONT(13,'bold');const w=ctx.measureText(toastMsg.s).width+28,y=AR_B-44;
    rr(W/2-w/2,y,w,28,14);ctx.fillStyle='rgba(12,9,16,.92)';ctx.fill();txt(toastMsg.s,W/2,y+14.5,FONT(13,'bold'),C.ink,'center');ctx.globalAlpha=1}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(scene==='play'&&G&&!modal){for(let k=0;k<G.speed;k++)step(dt)}
  if(banners.length){banners[0].t-=dt*(banners.length>1?1.6:1);if(banners[0].t<=0)banners.shift()}
  if(toastMsg){toastMsg.t-=dt;if(toastMsg.t<=0)toastMsg=null}
  if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
  render();requestAnimationFrame(frame);
}
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr=toLocal(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointerup',e=>{
  if(!ptr)return;const p=toLocal(e);ptr=null;
  for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x&&p.x<b.x+b.w&&p.y>=b.y&&p.y<b.y+b.h){b.fn();return}}
});
cv.addEventListener('pointercancel',()=>{ptr=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='play'&&G&&G.phase==='fight'&&!modal)modal={type:'pause'}});

window.__lh={get G(){return G},get modal(){return modal},set modal(v){modal=v},get setup(){return setup},step,newSetup,startRun,recruit,recruitDone,release,advance,gainRelic,openLunhui,lunhuiAct,buyItem,eventChoose,EVENTS,HEROES,RELICS,TUNE,rebirth,rollDao,addHero,startBattle,goStation,openLunhui,checkXian};
function boot(d){resize();loadArt();newSetup();if(d&&d.heroes)loadRun(d);requestAnimationFrame(frame)}
try{window.claude?.hot?.snapshot?.(()=>serialize())}catch(_){}
const hot=window.claude?.hot;
hot?.ready?hot.ready(boot):boot(hot?.data??null);
</script>
