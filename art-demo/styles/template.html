<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画风对比</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 同一个角色、四种画风；每张卡是一段战场，五个道相并排，按手机上的实际大小画 */
:root{
  --ink:#ece4d4; --dim:#a39a8b; --ground:#17141c; --card:#211c27; --line:#3a3245; --gold:#e8b44a;
  --display:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--ground);color:var(--ink);font-family:var(--body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.1;margin:0;color:var(--gold);text-wrap:balance}
.lead{margin:6px 0 0;color:var(--dim);max-width:64ch;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg span{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-right:4px}
.seg button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1d150a;font-weight:700}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}h1{font-size:36px}}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cell canvas{display:block;width:100%;aspect-ratio:1/0.62}
.meta{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.name{display:flex;align-items:baseline;gap:10px}
.name b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--gold)}
.name small{font-size:12px;color:var(--dim)}
.meta p{margin:0;font-size:13.5px;color:var(--dim)}
.meta p em{font-style:normal;color:var(--ink)}
.note{border-top:1px solid var(--line);padding-top:16px;color:var(--dim);font-size:14.5px;max-width:72ch;display:flex;flex-direction:column;gap:8px}
.note p{margin:0}
.note b{color:var(--ink);font-weight:500}
</style>

<div class="wrap">
  <header>
    <h1>画风对比 · 行脚僧</h1>
    <p class="lead">同一个原创角色、同一段描述，换四种画风各出一张待机图。每张卡里是一段战场，五个人从左到右是人道、天道、修罗、饿鬼、地狱，道相全部由同一套代码叠加。先看「战斗大小」，手机上实际就是这么大。</p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="大小">
      <span>大小</span>
      <button data-size="battle" aria-pressed="true">战斗大小</button>
      <button data-size="zoom" aria-pressed="false">放大看细节</button>
    </div>
    <div class="seg" role="group" aria-label="地面">
      <span>地面</span>
      <button data-bg="night" aria-pressed="true">夜色</button>
      <button data-bg="day" aria-pressed="false">白昼</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="note">/*NOTE*/</div>
</div>

<script>
const STYLES = /*STYLES*/;
const PATHS = [
  {k:'ren',n:'人道'},{k:'tian',n:'天道'},{k:'asura',n:'修罗'},{k:'ghost',n:'饿鬼'},{k:'hell',n:'地狱'},
];
let size='battle', bg='night';

function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}
function canvasOf(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
// 与六道演示同一套：按亮度映射到两端颜色，再与原色混合
function recolor(img, lo, hi, mix, sat, alpha){
  const c=canvasOf(img.width,img.height),x=c.getContext('2d');x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;
    let r=p[i],g=p[i+1],b=p[i+2];const L=(0.3*r+0.59*g+0.11*b)/255;
    if(sat!==1){const m=L*255;r=m+(r-m)*sat;g=m+(g-m)*sat;b=m+(b-m)*sat}
    if(lo){const tr=lo[0]+(hi[0]-lo[0])*L,tg=lo[1]+(hi[1]-lo[1])*L,tb=lo[2]+(hi[2]-lo[2])*L;r+=(tr-r)*mix;g+=(tg-g)*mix;b+=(tb-b)*mix}
    p[i]=r;p[i+1]=g;p[i+2]=b;if(alpha!==1)p[i+3]*=alpha;
  }
  x.putImageData(d,0,0);return c;
}
function silhouette(img,color){
  const c=canvasOf(img.width,img.height),x=c.getContext('2d');x.drawImage(img,0,0);
  x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c;
}

const grid=document.getElementById('grid'),cells=[];
async function prepare(){
  for(const S of STYLES){
    const img=await load(S.src);
    S.v={img,
      tian:recolor(img,[120,80,20],[255,236,170],0.22,1.05,1),
      asura:recolor(img,[40,0,6],[255,120,70],0.62,1,1),
      ghost:recolor(img,[20,60,40],[200,255,215],0.55,0.25,0.72),
      hell:recolor(img,[22,6,40],[210,150,255],0.62,0.9,1),
      gold:silhouette(img,'#ffd56a'),fire:silhouette(img,'#ff7a3a'),violet:silhouette(img,'#b46bff')};
    const el=document.createElement('div');el.className='cell';
    el.innerHTML=`<canvas aria-label="${S.name}画风战场样机"></canvas><div class="meta"><div class="name"><b>${S.name}</b><small>${S.tag}</small></div>${S.desc}</div>`;
    grid.appendChild(el);cells.push({S,cv:el.querySelector('canvas')});
  }
}

function ground(x,W,H,line){
  const day=bg==='day';
  const g=x.createLinearGradient(0,0,0,H);
  if(day){g.addColorStop(0,'#cdbf9e');g.addColorStop(1,'#a8946c')}else{g.addColorStop(0,'#2a2531');g.addColorStop(1,'#1b1820')}
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // 石板缝
  x.strokeStyle=day?'rgba(90,70,40,.18)':'rgba(255,255,255,.04)';x.lineWidth=1;
  for(let y=18;y<H;y+=34){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();
    for(let xx=(y/34|0)%2*26;xx<W;xx+=52){x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+34);x.stroke()}}
  if(!line)return;
  // 防线
  x.strokeStyle=day?'rgba(150,40,30,.45)':'rgba(232,180,74,.35)';x.setLineDash([8,6]);x.lineWidth=1.5;
  x.beginPath();x.moveTo(0,H*0.30);x.lineTo(W,H*0.30);x.stroke();x.setLineDash([]);
}

function drawFig(x,S,k,fx,fy,figPx,sec,phase){
  const V=S.v,img=V.img,s=figPx/S.h,smooth=!S.pixel;
  x.imageSmoothingEnabled=smooth;x.imageSmoothingQuality='high';
  const breathe=1+Math.sin(sec*2.4+phase)*0.012;
  const lift=k==='tian'?figPx*0.12+Math.sin(sec*2+phase)*2:k==='ghost'?figPx*0.18+Math.sin(sec*2.6+phase)*3:0;
  const put=(im,dx=0,dy=0)=>{const w=img.width*s,h=img.height*s*breathe;x.drawImage(im,fx-S.cx*s+dx,fy-S.feet*s*breathe-lift+dy,w,h)};
  const u=figPx/64; // 特效按 64px 战斗身高标定
  if(k!=='ghost'){x.fillStyle='rgba(0,0,0,.32)';x.beginPath();x.ellipse(fx,fy+1,figPx*0.36,figPx*0.08,0,0,7);x.fill()}
  if(k==='hell'){
    const R=figPx*0.5;x.save();x.globalCompositeOperation='lighter';
    x.strokeStyle='rgba(160,90,255,.5)';x.lineWidth=2*u;x.setLineDash([6*u,5*u]);x.lineDashOffset=-sec*24;
    x.beginPath();x.ellipse(fx,fy,R,R*0.3,0,0,7);x.stroke();x.setLineDash([]);
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2+sec*0.6,ph=(sec*1.4+i*0.37)%1,px=fx+Math.cos(a)*R,py=fy+Math.sin(a)*R*0.3-ph*18*u;
      x.fillStyle=`rgba(${190+40*(1-ph)|0},${90*(1-ph)|0},255,${0.65*(1-ph)})`;x.beginPath();x.ellipse(px,py,2.6*u*(1-ph*0.5),5*u*(1-ph*0.4),0,0,7);x.fill()}
    x.restore();
  }
  if(k==='tian'){x.fillStyle='rgba(255,240,205,.85)';for(const [ox,oy,r] of [[-17,3,9],[-5,0,11],[9,2,10],[20,5,7]]){x.beginPath();x.ellipse(fx+ox*u,fy+oy*u-lift*0.15,r*u,r*u*0.45,0,0,7);x.fill()}}
  if(k==='tian'){x.save();x.shadowColor='rgba(255,210,100,.95)';x.shadowBlur=10*u;for(const [dx,dy] of [[-1.2,0],[1.2,0],[0,-1.2],[0,1.2]])put(V.gold,dx*u,dy*u);x.restore()}
  if(k==='asura'){x.save();x.globalCompositeOperation='lighter';for(let j=0;j<5;j++){x.globalAlpha=0.35;put(V.fire,Math.sin(sec*23+j*1.7)*1.8*u,-Math.abs(Math.cos(sec*19+j))*2.6*u)}x.restore();x.globalAlpha=1}
  if(k==='hell'){x.save();x.shadowColor='rgba(170,90,255,.9)';x.shadowBlur=8*u;for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]])put(V.violet,dx*u,dy*u);x.restore()}
  put(k==='ren'?img:V[k]);
  if(k==='tian'){const hy=fy-lift-figPx*breathe-6*u;x.strokeStyle='rgba(255,214,110,.95)';x.lineWidth=Math.max(1.5,1.8*u);x.beginPath();x.ellipse(fx,hy,12*u,3.5*u,0,0,7);x.stroke()}
  if(k==='ghost'){x.save();x.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const a=sec*1.8+i*2.1,px=fx+Math.cos(a)*26*u,py=fy-lift-figPx*0.6+Math.sin(a)*10*u;
    const g=x.createRadialGradient(px,py,0,px,py,7*u);g.addColorStop(0,'rgba(170,255,190,.95)');g.addColorStop(1,'rgba(80,200,120,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,7*u,0,7);x.fill()}x.restore()}
}

function draw(t){
  const sec=t/1000;
  for(const c of cells){
    const cv=c.cv,dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
    if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
    ground(x,W,H,size==='battle');
    if(size==='battle'){
      // 手机逻辑宽 420 时英雄身高约 64；按卡片宽度等比换算，最多 64
      const figPx=Math.min(64,W/420*64*1.25),step=W/5;
      PATHS.forEach((P,i)=>drawFig(x,c.S,P.k,step*(i+0.5),H*0.72+(i%2?-8:6)*figPx/64,figPx,sec,i*1.3));
      x.font='12px '+getComputedStyle(document.body).fontFamily;x.textAlign='center';x.fillStyle=bg==='day'?'rgba(40,30,20,.75)':'rgba(236,228,212,.6)';
      PATHS.forEach((P,i)=>x.fillText(P.n,step*(i+0.5),H-10));
    }else{
      drawFig(x,c.S,'ren',W/2,H*0.93,H*0.84,sec,0);
    }
  }
}

let t0=performance.now(),paused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){draw(paused?0:now-t0);if(!paused)requestAnimationFrame(loop)}
function bind(attr,set){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.addEventListener('click',()=>{set(b.dataset[attr]);
  document.querySelectorAll(`[data-${attr}]`).forEach(o=>o.setAttribute('aria-pressed',o===b));if(paused)draw(0)}))}
bind('size',v=>size=v);bind('bg',v=>bg=v);
window.addEventListener('resize',()=>{if(paused)draw(0)});
prepare().then(()=>{draw(0);if(!paused)requestAnimationFrame(loop)});
</script>
