function wpick(list){list=list.filter(([,w])=>w>0);let s=0;for(const[,w]of list)s+=w;let r=rnd()*s;for(const[k,w]of list){r-=w;if(r<=0)return k}return list[list.length-1][0]}
function wsample(list,k){const out=[],l=list.slice();while(out.length<k&&l.length){const x=wpick(l);out.push(x);l.splice(l.findIndex(([y])=>y===x),1)}return out}

function formOf(h){return HEROES[h.key].forms[h.dao]}
function calcStats(h){
  const D=HEROES[h.key],R=ROLE[D.role],F=formOf(h),M=DAO_MOD[h.dao];
  let g=(1+0.05*h.rebirths)*(1+0.05*h.deaths*(h.key==='yuan'?1:0))*(1+0.1*(h.surv||0))*(D.weak||1);
  let hpG=g,atkG=g;
  if(h.rebirths>=5)hpG*=1.2;if(h.rebirths>=10)atkG*=1.2;if(h.rebirths>=15){hpG*=1.2;atkG*=1.2}
  if(G.rally)atkG*=1.2;
  if(hasR('sarira')&&G.heroes.some(x=>x.dao==='fo'))atkG*=1.25;
  if(h.zhuang)atkG*=2;
  const st={emo:F.emo,name:F.name,melee:F.melee??R.melee,range:F.range??R.range,
    hp:R.hp*(M.hp||1)*(F.hpMul||1)*hpG,atk:R.atk*(M.atk||1)*(F.atkMul||1)*atkG,cd:R.cd*(M.cd||1)*(F.cdMul||1),spd:R.spd*(M.spd||1),
    heal:F.heal===0?0:(R.heal||0)*(F.healMul||1)*hpG,lifesteal:(M.lifesteal||0)*(F.lsMul||1),drain:M.drain||0,
    taunt:F.taunt||0,guardAura:F.guardAura||0,cleave:F.cleave||0,stun:F.stun||0,dodge:F.dodge||0,pierce:F.pierce||1,
    regenAura:F.regenAura||0,poison:!!F.poison,crit:F.crit||0,splash:F.splash??R.splash??0,chain:F.chain||(h.zhuang?3:0),frenzy:!!F.frenzy};
  return st;
}
function setStats(h,full){h.st=calcStats(h);const r=h.maxhp?h.hp/h.maxhp:1;h.maxhp=h.st.hp;h.hp=full?h.maxhp:Math.max(1,h.maxhp*r)}
function addHero(key){
  const h={id:G.nextId++,key,name:HEROES[key].name,aff:HEROES[key].aff,dao:'ren',rebirths:0,deaths:0,surv:0,life:1+Math.floor(rnd()*3),
    state:'alive',x:ALTAR.x,y:ALTAR.y-30,ax:ALTAR.x,ay:ALTAR.y-60,hp:0,maxhp:0,atkT:0.3,reviveT:0,shield:0,hits:0,diedThis:false,toTian:false,zhuang:false};
  setStats(h,true);G.heroes.push(h);layoutAnchors();return h;
}
function layoutAnchors(){
  const mel=G.heroes.filter(h=>calcStats(h).melee),rng=G.heroes.filter(h=>!calcStats(h).melee);
  const place=(list,y)=>list.forEach((h,i)=>{h.ax=list.length===1?210:110+200*i/(list.length-1);h.ay=y});
  place(mel,388);place(rng,448);
}
function rollDao(h){
  if(h.toTian){h.toTian=false;return'tian'}
  const w=DAOS.map(d=>[d,BASE_W[d]*(d===h.aff?2:1)]);
  return wpick(w);
}
// 一次转世：source = death（战死）/ life（寿尽）/ early（提前）/ effect（法宝或技能）
function rebirth(h,d,source){
  const prev=h.dao;
  h.rebirths+=hasR('wheel')?2:1;h.dao=d;h.life=lifeOf(d);h.hits=0;
  G.stats.rebirths++;G.stats.by[d]=(G.stats.by[d]||0)+1;

function newSetup(){RS=(Math.random()*2147483647)|0;setup={master:'abbot',rs:RS}}

    run=['battle','elite'].includes(t)?0:run+1;if(t==='recruit')rec=true;n.push(t);
  }

}

// ================= 战斗 =================
function buildWave(type){
  const b=G.battles,budget=(TUNE.budgetBase+TUNE.budgetStep*b)*(type==='elite'?0.7:type==='boss'?0.6:1);
  const pool=[['grunt',5],['tank',2],['archer',b>=1?2:0],['mole',b>=2?1.5:0],['assassin',b>=3?1.5:0],['brute',b>=4?1:0]];
  const q=[];let left=budget;
  while(left>0){const t=wpick(pool);q.push({type:t,t:1+rnd()*26});left-=ENEMY[t].cost}
  if(type==='elite')q.push({type:pick(['brute','tank','assassin']),t:4,elite:true});
  if(type==='boss')q.push({type:G.ch===0?'ox':'bone',t:5});
  return q.sort((a,b)=>a.t-b.t);
}
function startBattle(type){
  G.phase='fight';G.btype=type;G.waveT=0;G.spawnQ=buildWave(type);G.curComp=G.spawnQ.slice();
  G.enemies=[];G.projs=[];G.minions=[];G.fx=[];
  for(const h of G.heroes){h.diedThis=false;h.state='alive';h.shield=0;h.reviveT=0;h.x=h.ax+jit(10);h.y=h.ay+40;setStats(h,true)}
  for(const h of G.heroes)if(h.key==='tamer')summonPets(h,h.dao==='beast'?3:1);
}
function summonPets(h,n){
  const mul=h.dao==='tian'?2:1;
  for(let k=0;k<n;k++)spawnMinion(h,{emo:'🐺',hp:h.maxhp*0.6,atk:h.st.atk*0.5*mul,cd:0.8,ttl:999,spd:80,pet:true});
}
function battleEnd(){
  G.phase='post';G.battles++;
  const t=G.btype,gain=t==='boss'?40:t==='elite'?25:12+2*G.battles;addMerit(gain);
  if(hasR('incense'))addMerit(8);
  G.rally=false;
  for(const h of G.heroes){
    if(h.key==='shou'){h.surv=h.diedThis?0:(h.surv||0)+1}

  }

function openLunhui(){modal={type:'lunhui',results:{}};saveGame('lunhui')}

// ---- 敌人 ----
function spawnEnemy(item){
  const d=ENEMY[item.type],b=G.battles,hpS=Math.pow(TUNE.hpGrowth,b),atkS=Math.pow(TUNE.atkGrowth,b);
  let x,y;
  if(d.mole){const a=Math.random()*Math.PI;x=ALTAR.x+Math.cos(a)*70;y=ALTAR.y-Math.sin(a)*50}
  else if(d.boss||rnd()<0.75){x=30+rnd()*360;y=AR_T+14}else{x=rnd()<0.5?14:W-14;y=AR_T+30+rnd()*160}
  if(d.boss)x=W/2;
  const el=item.elite?{hp:5,atk:1.6,size:1.35}:{hp:1,atk:1,size:1};
  const e={type:item.type,name:(item.elite?'精英':'')+d.name,emo:d.emo,x,y,hp:d.hp*hpS*el.hp,atk:d.atk*atkS*el.atk,cd:d.cd,spd:d.spd,range:d.range,
    altar:d.altar*(item.elite?2:1),size:d.size*el.size,ranged:!!d.ranged,assassin:!!d.assassin,mole:!!d.mole,boss:d.boss||null,elite:!!item.elite,
    atkT:0.8,retT:0,tgt:null,slowT:0,stunT:0,poisonT:0,poisonD:0,flash:0,skT:5,sumT:6,leapt:false};
  e.maxhp=e.hp;G.enemies.push(e);
  if(d.mole)G.fx.push({k:'ring',x,y,r:24,t:0.4,m:0.4,col:'#9c7440'});
  return e;
}
const allyAlive=a=>a.minion?!a.dead:a.state==='alive';
function allies(){return[...G.heroes.filter(h=>h.state==='alive'),...G.minions.filter(m=>!m.dead)]}
function enemyTarget(e){
  const hs=G.heroes.filter(h=>h.state==='alive');
  if(e.mole||G.waveT>50)return'altar';
  if(e.assassin){let best=null,by=-1;for(const h of hs)if(!h.st.melee&&h.y>by){by=h.y;best=h}return best||hs[0]||'altar'}
  const al=allies();let best=null,bd=1e9;
  for(const a of al){const t=a.minion?0:a.st.taunt;if(!t)continue;const d=dist(a,e);if(d<=t&&d<bd){bd=d;best=a}}
  if(best)return best;
  bd=e.ranged?200:90;
  for(const a of al){const d=dist(a,e);if(d<bd){bd=d;best=a}}
  return best||'altar';
}
function hurtAlly(a,d,e){
  if(a.minion){a.hp-=d;if(a.hp<=0)a.dead=true;return}
  const h=a;
  if(h.st.dodge&&Math.random()<h.st.dodge){G.floats.push({x:h.x,y:h.y-20,s:'闪',col:C.sky,t:0.6});return}
  if(hasR('mirror')&&h.st.melee)d*=0.75;
  const ga=G.heroes.find(g=>g!==h&&g.state==='alive'&&g.st.guardAura&&dist(g,h)<=90);if(ga)d*=1-ga.st.guardAura;
  if(h.shield>0){const s=Math.min(h.shield,d);h.shield-=s;d-=s}
  h.hp-=d;h.hitT=0.12;
  if(h.hp<=0)heroDie(h,e);
}
function enemyTick(e,dt){
  if(e.flash>0)e.flash-=dt;if(e.slowT>0)e.slowT-=dt;
  if(e.poisonT>0){e.poisonT-=dt;e.hp-=e.poisonD*dt;if(e.hp<=0){killEnemy(e,null);return}}
  if(e.stunT>0){e.stunT-=dt;return}
  if(e.boss)bossTick(e,dt);
  e.atkT-=dt;e.retT-=dt;
  if(e.tgt&&e.tgt!=='altar'&&!allyAlive(e.tgt))e.retT=0;
  if(e.retT<=0){e.retT=0.4;e.tgt=enemyTarget(e)}
  const t=e.tgt,isAltar=t==='altar';
  if(e.assassin&&!isAltar&&!e.leapt&&dist(e,t)<180){e.leapt=true;e.x=t.x+jit(14);e.y=t.y+18;G.fx.push({k:'ring',x:e.x,y:e.y,r:20,t:0.3,m:0.3,col:'#e0745f'})}
  const tx=isAltar?ALTAR.x:t.x,ty=isAltar?ALTAR.y:t.y,reach=isAltar?ALTAR.r+Math.min(e.range,24):e.range+12;
  const d=Math.hypot(tx-e.x,ty-e.y);
  if(d>reach)moveToward(e,tx,ty,e.spd*(e.slowT>0?0.6:1)*dt);
  else if(e.atkT<=0){
    e.atkT=e.cd;
    if(isAltar){const v=e.altar*(hasR('barrier')?0.7:1);G.altar-=v;G.dmgBy[e.name]=(G.dmgBy[e.name]||0)+v;G.altarHitT=0.3}
    else{if(e.ranged)G.fx.push({k:'line',x:e.x,y:e.y,x2:t.x,y2:t.y,t:0.15,m:0.15,col:'#e0745f'});hurtAlly(t,e.atk,e)}
  }
}
function bossTick(e,dt){
  e.skT-=dt;
  if(e.skT<=0){e.skT=5;const r=e.boss==='slam'?75:90;for(const a of allies())if(dist(a,e)<=r)hurtAlly(a,e.atk*1.5,e);G.fx.push({k:'ring',x:e.x,y:e.y,r,t:0.4,m:0.4,col:'#e0573f'})}
  if(e.boss==='summon'){e.sumT-=dt;if(e.sumT<=0){e.sumT=7;for(let k=0;k<3;k++){const m=spawnEnemy({type:'grunt'});m.emo='🦴';m.name='骷髅';m.x=e.x+jit(40);m.y=e.y+10}}}
}
function hitEnemy(e,d,h,opt){
  if(e.dead)return;
  if(h){
    if(h.st.lifesteal&&h.state==='alive')h.hp=Math.min(h.maxhp,h.hp+d*h.st.lifesteal);
    const stun=(opt&&opt.stun)||(h.st.stun&&Math.random()<h.st.stun?0.6:0);
    if(stun)e.stunT=Math.max(e.stunT,stun*(e.boss?0.3:1));
    if(h.st.poison){e.poisonT=4;e.poisonD=e.maxhp*(e.boss?0.006:0.03)}
  }
  e.hp-=d;e.flash=0.1;
  if(e.hp<=0)killEnemy(e,h);
}
function killEnemy(e,h){
  if(e.dead)return;e.dead=true;G.stats.kills++;G.kills++;
  G.fx.push({k:'puff',x:e.x,y:e.y,t:0.3,m:0.3,col:'#e0573f'});
  if(h&&h.state==='alive'&&!h.minion){
    if(hasR('blade')&&h.dao==='asura')h.hp=Math.min(h.maxhp,h.hp+h.maxhp*0.1);
    if(hasR('beasts')&&h.dao==='beast'&&G.minions.filter(m=>m.owner===h.id&&!m.pet).length<2)spawnMinion(h,{emo:'🐗',hp:h.maxhp*0.3,atk:h.st.atk*0.4,cd:0.8,ttl:8,spd:80});
  }
  if(hasR('book')){G.bookKills++;if(G.bookKills>=25){G.bookKills=0;const c=G.heroes.filter(x=>x.state==='alive'&&x.dao!=='fo');if(c.length){const x=pick(c);const d=rebirth(x,rollDao(x),'effect');G.floats.push({x:x.x,y:x.y-28,s:`因果 → ${DAO_SHORT[d]}·${x.st.name}`,col:DAO_COL[d],t:1.4})}}}
  if(e.boss){banner(`${e.name}伏诛`,'',C.gold);flash={col:'#e8b44a',t:0.4}}
}

// ---- 英雄行动、死亡与复活 ----
function heroTick(h,dt){
  const st=h.st;
  if(h.hitT>0)h.hitT-=dt;if(h.furyT>0)h.furyT-=dt;
  if(st.drain){G.altar-=st.drain*dt;G.dmgBy['恶鬼形态']=(G.dmgBy['恶鬼形态']||0)+st.drain*dt}
  h.atkT-=dt;
  let tgt=null,heal=false;
  if(st.heal){let bp=0.9;for(const a of G.heroes){if(a.state!=='alive')continue;const p=a.hp/a.maxhp;if(p<bp&&dist(a,h)<=st.range){bp=p;tgt=a}}if(tgt)heal=true}
  if(!tgt){
    let bd=1e9;
    for(const e of G.enemies){if(e.dead)continue;const ds=dist(h,e);
      if(st.melee){const da=Math.hypot(e.x-h.ax,e.y-h.ay);if((da<=100||(e.tgt===h&&da<=200))&&ds<bd){bd=ds;tgt=e}}
      else if(ds<=st.range&&ds<bd){bd=ds;tgt=e}}
  }
  if(tgt){
    const reach=heal?st.range:st.range+(tgt.size||0)*0.4,d=dist(h,tgt);
    if(d>reach){if(st.melee)moveToward(h,tgt.x,tgt.y,st.spd*dt)}
    else if(h.atkT<=0){h.atkT=st.cd*(st.frenzy?Math.max(0.5,1-0.04*h.hits):1)*(h.furyT>0?0.625:1);heal?doHeal(h,tgt):heroAttack(h,tgt)}
  }else moveToward(h,h.ax,h.ay,st.spd*dt);
  if(st.regenAura)for(const a of G.heroes)if(a.state==='alive'&&dist(a,h)<=110)a.hp=Math.min(a.maxhp,a.hp+st.regenAura*a.maxhp*dt);
}
function doHeal(h,a){
  const amt=Math.min(h.st.heal,a.maxhp-a.hp);a.hp+=amt;
  if(h.dao==='ghost')h.hp=Math.min(h.maxhp,h.hp+amt*0.3);
  G.fx.push({k:'line',x:h.x,y:h.y,x2:a.x,y2:a.y,t:0.25,m:0.25,col:'#7fe0a8'});
}
function heroAttack(h,t){
  const st=h.st;h.hits++;let dmg=st.atk;
  if(st.crit&&Math.random()<st.crit){dmg*=2.5;G.floats.push({x:t.x,y:t.y-18,s:'暴击',col:C.gold,t:0.6})}
  if(st.melee){
    hitEnemy(t,dmg,h);
    if(st.cleave)for(const e of G.enemies)if(e!==t&&!e.dead&&dist(e,t)<=st.cleave)hitEnemy(e,dmg*0.6,h);
    G.fx.push({k:'slash',x:t.x,y:t.y,t:0.15,m:0.15,col:h.dao==='asura'?'#ff7a5a':'#f0e6d0'});return;
  }
  if(st.chain){
    const hit=[t];let cur=t,px=h.x,py=h.y;
    for(let k=0;k<st.chain&&cur;k++){G.fx.push({k:'line',x:px,y:py,x2:cur.x,y2:cur.y,t:0.15,m:0.15,col:'#cdbcff'});px=cur.x;py=cur.y;hitEnemy(cur,dmg*Math.pow(0.8,k),h);
      if(st.splash)for(const e of G.enemies)if(e!==cur&&!e.dead&&dist(e,cur)<=st.splash)hitEnemy(e,dmg*0.4,h);
      let nb=null,nd=90;for(const e of G.enemies){if(e.dead||hit.includes(e))continue;const d=Math.hypot(e.x-px,e.y-py);if(d<nd){nd=d;nb=e}}cur=nb;if(nb)hit.push(nb)}
    return;
  }
  const targets=[t];
  if(st.pierce>1)for(const e of G.enemies){if(targets.length>=st.pierce)break;if(!e.dead&&!targets.includes(e)&&dist(e,h)<=st.range)targets.push(e)}
  for(const x of targets)G.projs.push({x:h.x,y:h.y-6,t:x,dmg,src:h,splash:st.splash,col:h.dao==='fo'?'#ffd98a':h.dao==='asura'?'#ff9a7a':'#f0e6d0'});
}
function heroDie(h,killer){
  if(h.state!=='alive')return;
  h.state='dead';h.hp=0;h.diedThis=true;h.deaths++;G.stats.deaths++;
  const ex=h.x,ey=h.y,wasDao=h.dao;
  // —— 阵亡时触发 ——
  if(G.master==='city')addMerit(1);
  if(hasR('karma'))for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-ex,e.y-ey)<=90)hitEnemy(e,h.maxhp*0.5,null);
  if(h.key==='phoenix'){for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-ex,e.y-ey)<=90)hitEnemy(e,h.st.atk*3,null);G.fx.push({k:'ring',x:ex,y:ey,r:90,t:0.4,m:0.4,col:'#ff9a5a'})}
  if(hasR('karma'))G.fx.push({k:'ring',x:ex,y:ey,r:90,t:0.4,m:0.4,col:'#e0573f'});
  if(hasR('ledger')&&killer&&!killer.dead)hitEnemy(killer,h.st.atk*4,null);
  if(hasR('will')&&wasDao==='ghost')for(const a of G.heroes)if(a.state==='alive')a.hp=Math.min(a.maxhp,a.hp+a.maxhp*0.15);
  for(const j of G.heroes)if(j.key==='judge'&&j.state==='alive'){let t=null,lo=1e9;for(const e of G.enemies)if(!e.dead&&e.hp<lo){lo=e.hp;t=e}
    if(t){hitEnemy(t,j.st.atk*4*(j.dao==='hell'?2:1),null);G.fx.push({k:'line',x:t.x,y:AR_T,x2:t.x,y2:t.y,t:0.3,m:0.3,col:'#cdbcff'})}}
  for(const m of G.minions)if(m.owner===h.id&&m.pet)m.dead=true;
  // —— 立刻转世（佛陀、金身除外） ——
  let txt2;
  if(h.dao==='fo')txt2='佛陀 · 不入轮回';
  else if(hasR('gold')&&h.dao==='tian')txt2='金身 · 仍是天道';
  else{const d=rebirth(h,rollDao(h),'death');txt2=`转世 → ${DAO_SHORT[d]}·${h.st.name}`}
  G.floats.push({x:ex,y:ey-24,s:txt2,col:DAO_COL[h.dao],t:1.6});
  h.reviveT=6*(hasR('banner')?0.6:1)*(G.rally?0.5:1);
}
function revive(h){
  h.state='alive';h.x=ALTAR.x+jit(12);h.y=ALTAR.y-26;h.maxhp=0;setStats(h,true);h.atkT=0.3;
  G.fx.push({k:'pillar',x:h.x,y:h.y,t:0.6,m:0.6,col:DAO_COL[h.dao]});
  // —— 复活时触发 ——
  if(hasR('soup'))h.shield+=h.maxhp*0.3;
  if(h.key==='phoenix')h.shield+=h.maxhp*0.5;
  if(h.key==='wood'){h.shield+=h.maxhp*0.4;for(const e of G.enemies)if(!e.dead&&!e.assassin&&dist(e,h)<=220){e.tgt=h;e.retT=3}}
  if(h.key==='tamer'&&h.dao==='beast')summonPets(h,2);
  if(hasR('bell')){for(const e of G.enemies)if(!e.dead&&dist(e,h)<=90)hitEnemy(e,h.st.atk*3,h);G.fx.push({k:'ring',x:h.x,y:h.y,r:90,t:0.4,m:0.4,col:C.gold})}
  if(hasR('fury'))h.furyT=5;
  for(const x of G.heroes)if(x.key==='healer'&&x.state==='alive'&&x.st.heal>0)for(const a of G.heroes)if(a.state==='alive')a.hp=Math.min(a.maxhp,a.hp+a.maxhp*0.15);
}
function spawnMinion(h,o){
  const m=Object.assign({minion:true,owner:h.id,x:h.x+jit(16),y:h.y+jit(10),atkT:0.4,range:22,spd:70},o);
  m.maxhp=m.hp;G.minions.push(m);return m;
}
function minionTick(m,dt){
  m.ttl-=dt;if(m.ttl<=0||m.hp<=0){m.dead=true;return}
  m.atkT-=dt;let t=null,bd=220;
  for(const e of G.enemies){if(e.dead)continue;const d=dist(e,m);if(d<bd){bd=d;t=e}}
  if(!t){const o=heroById(m.owner);if(o)moveToward(m,o.ax+jit(2),o.ay-20,m.spd*dt);return}
  if(bd>m.range+t.size*0.4)moveToward(m,t.x,t.y,m.spd*dt);
  else if(m.atkT<=0){m.atkT=m.cd;hitEnemy(t,m.atk,null);G.fx.push({k:'slash',x:t.x,y:t.y,t:0.12,m:0.12,col:'#d0c8b8'})}
}

// ================= 主循环（模拟） =================
function step(dt){
  if(!G||G.phase!=='fight')return;
  G.waveT+=dt;while(G.spawnQ.length&&G.spawnQ[0].t<=G.waveT)spawnEnemy(G.spawnQ.shift());
  for(const h of G.heroes){
    if(h.state==='dead'){h.reviveT-=dt;if(h.reviveT<=0)revive(h)}
    else heroTick(h,dt);
  }
  for(const m of G.minions)if(!m.dead)minionTick(m,dt);
  for(const e of G.enemies)if(!e.dead)enemyTick(e,dt);
  G.zapT=(G.zapT||0)-dt;
  if(G.zapT<=0){let t=null,bd=ALTAR.r+60;for(const e of G.enemies){const d=dist(e,ALTAR);if(!e.dead&&d<bd){bd=d;t=e}}
    if(t){G.zapT=1;hitEnemy(t,14*Math.pow(1.2,G.battles),null);G.fx.push({k:'line',x:ALTAR.x,y:ALTAR.y,x2:t.x,y2:t.y,t:0.15,m:0.15,col:'#f3d27a'})}}
  for(const p of G.projs){
    if(p.done)continue;if(p.t.dead){p.done=true;continue}
    const dx=p.t.x-p.x,dy=p.t.y-p.y,d=Math.hypot(dx,dy),v=480*dt;
    if(d<=v+6){p.done=true;hitEnemy(p.t,p.dmg,p.src);
      if(p.splash){for(const e of G.enemies)if(e!==p.t&&!e.dead&&dist(e,p.t)<=p.splash)hitEnemy(e,p.dmg*0.6,p.src);G.fx.push({k:'ring',x:p.t.x,y:p.t.y,r:p.splash,t:0.25,m:0.25,col:'#f3d27a'})}}
    else{p.x+=dx/d*v;p.y+=dy/d*v}
  }
  separate([...G.heroes.filter(h=>h.state==='alive'),...G.minions.filter(m=>!m.dead)],16);
  separate(G.enemies.filter(e=>!e.dead),18);
  for(const f of G.fx)f.t-=dt;for(const f of G.floats){f.t-=dt;f.y-=18*dt}
  if(G.altarHitT>0)G.altarHitT-=dt;
  G.enemies=G.enemies.filter(e=>!e.dead);G.minions=G.minions.filter(m=>!m.dead);G.projs=G.projs.filter(p=>!p.done);
  G.fx=G.fx.filter(f=>f.t>0);G.floats=G.floats.filter(f=>f.t>0);
  if(G.altar<=0){G.altar=0;gameOver(false);return}
  if(!G.spawnQ.length&&!G.enemies.length)battleEnd();
}
function separate(list,r){
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>0&&d<r){const p=(r-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}}
  for(const o of list){o.x=clamp(o.x,10,W-10);o.y=clamp(o.y,AR_T+8,AR_B-8)}
}

function guanOptions(h){
  const n=3+(hasR('lamp')?1:0),out=[];let guard=0;
  while(out.length<n&&guard++<40){const d=rollDao(h);if(!out.includes(d)||guard>20)out.push(d)}
  return out;
}
function lunhuiAct(h,act){
  const due=h.life<=0&&h.dao!=='fo';
  if(act==='free'){const d=rebirth(h,rollDao(h),due?'life':'early');modal.results[h.id]=d}
  else if(act==='guan'){if(G.merit<COST.guan)return toast('香火不够');G.merit-=COST.guan;modal={type:'guan',hero:h.id,opts:guanOptions(h),src:due?'life':'early',back:modal}}
  else if(act==='extend'){if(G.merit<COST.extend)return toast('香火不够');G.merit-=COST.extend;h.life=1;modal.results[h.id]='extend'}
  else if(act==='early'){if(G.merit<COST.early)return toast('香火不够');G.merit-=COST.early;const d=rebirth(h,rollDao(h),'early');modal.results[h.id]=d}
}
function useActive(h){
  const m=G.master;G.activeUsed[G.ch]=true;
  if(m==='abbot'){const d=rebirth(h,'tian','effect');modal.results[h.id]=d}
  else if(m==='city'){modal={type:'guan',hero:h.id,opts:guanOptions(h),src:'effect',back:modal}}
}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  scale=Math.min(aw/W,ah/H);const dpr=window.devicePixelRatio||1;
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize',resize);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,font,col,al='left',bl='middle'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y)}
function emo(e,x,y,size){ctx.font=EFONT(size);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(e,x,y)}
function wrapText(s,x,y,maxW,lh,font,col){ctx.font=font;let line='',yy=y;for(const ch of s){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){txt(line,x,yy,font,col);line=ch;yy+=lh}else line=t}if(line)txt(line,x,yy,font,col);return yy+lh}
function button(x,y,w,h,label,fn,o={}){
  rr(x,y,w,h,o.r??8);ctx.globalAlpha=o.disabled?0.4:1;ctx.fillStyle=o.bg||C.panel2;ctx.fill();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||1.5;ctx.stroke()}
  if(label)txt(label,x+w/2,y+h/2+1,o.font||FONT(14,'bold'),o.col||C.ink,'center');
  ctx.globalAlpha=1;if(!o.disabled&&fn)btns.push({x,y,w,h,fn});
}
function bar(x,y,w,h,v,col,bg){ctx.fillStyle=bg||'rgba(0,0,0,.5)';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(v,0,1),h)}
function daoChip(x,y,d,label){ctx.font=FONT(10,'bold');const s=label||DAO_SHORT[d],w=ctx.measureText(s).width+8;rr(x,y-7,w,14,4);ctx.fillStyle=DAO_COL[d];ctx.fill();txt(s,x+4,y,FONT(10,'bold'),DAO_INK(d));return x+w+3}
function lifePips(x,y,n){for(let i=0;i<Math.min(n,5);i++){ctx.beginPath();ctx.arc(x+i*7,y,2.6,0,7);ctx.fillStyle=C.gold;ctx.fill()}}
function panel(x,y,w,h){ctx.fillStyle='rgba(8,6,12,.75)';ctx.fillRect(0,0,W,H);rr(x,y,w,h,14);ctx.fillStyle=C.panel;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke()}
const block=()=>btns.push({x:0,y:0,w:W,h:H,fn:()=>{}});
const backdrop=fn=>btns.push({x:0,y:0,w:W,h:H,fn});

// ================= 战斗界面 =================
function renderPlay(){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,AR_T,0,AR_B);g.addColorStop(0,G.ch?'#1d1a2a':'#251a26');g.addColorStop(1,'#1c2420');
  ctx.fillStyle=g;ctx.fillRect(0,AR_T,W,AR_B-AR_T);
  ctx.strokeStyle='rgba(232,180,74,.07)';ctx.lineWidth=1;
  for(let r=60;r<420;r+=60){ctx.beginPath();ctx.arc(ALTAR.x,ALTAR.y,r,Math.PI,Math.PI*2);ctx.stroke()}
  ctx.beginPath();ctx.arc(ALTAR.x,ALTAR.y,ALTAR.r+6,0,7);ctx.fillStyle=G.altarHitT>0?'rgba(224,87,63,.5)':'rgba(232,180,74,.15)';ctx.fill();
  ctx.beginPath();ctx.arc(ALTAR.x,ALTAR.y,ALTAR.r,0,7);ctx.fillStyle='#3a2c1e';ctx.fill();ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.stroke();
  txt('☸',ALTAR.x,ALTAR.y+1,FONT(24),C.gold,'center');
  if(G.phase==='fight'){
    const ents=[...G.enemies.map(e=>({e,y:e.y})),...G.minions.map(m=>({m,y:m.y})),...G.heroes.filter(h=>h.state==='alive').map(h=>({h,y:h.y}))].sort((a,b)=>a.y-b.y);
    for(const o of ents)o.e?drawEnemy(o.e):o.m?drawMinion(o.m):drawHero(o.h);
    for(const p of G.projs){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}
  }else{for(const h of G.heroes)drawHero(Object.assign({},h,{x:h.ax,y:h.ay}))}
  for(const f of G.fx){
    const a=clamp(f.t/f.m,0,1);ctx.globalAlpha=a;
    if(f.k==='puff'){ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,12*(1.4-a),0,7);ctx.fill()}
    else if(f.k==='ring'){ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.1-a*0.4),0,7);ctx.stroke()}
    else if(f.k==='line'){ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke()}
    else if(f.k==='slash'){ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,11,-2.4,-0.6);ctx.stroke()}
    else if(f.k==='pillar'){ctx.fillStyle=f.col;ctx.fillRect(f.x-10*a,AR_T,20*a,f.y-AR_T+10)}
    ctx.globalAlpha=1;
  }
  for(const f of G.floats){ctx.globalAlpha=clamp(f.t,0,1);txt(f.s,f.x,f.y,FONT(12,'bold'),f.col,'center');ctx.globalAlpha=1}
  renderTop();renderRoster();
}

    panel(20,90,W-40,580);block();const s=G.stats;
    txt(m.win?'功德圆满':'法坛倾覆',W/2,130,DFONT(38),m.win?C.gold:C.red,'center');
    txt(m.win?'两章走完，守坛成功':`倒在第${G.ch+1}章第${G.st+1}站`,W/2,164,FONT(13),C.dim,'center');
    const worst=Object.entries(G.dmgBy).sort((a,b)=>b[1]-a[1])[0];
    const rows=[['转世 / 阵亡',`${s.rebirths} / ${s.deaths}`],['成佛',s.buddha],['击杀',s.kills],['法宝',G.relics.map(k=>RELICS[k].emo).join('')||'无'],['法坛最大威胁',worst?`${worst[0]}（${Math.round(worst[1])}）`:'无']];
    rows.forEach(([k,v],j)=>{const y=196+j*26;txt(k,44,y,FONT(12),C.dim);txt(String(v),W-44,y,FONT(12,'bold'),C.ink,'right')});
    let y=340;txt('英雄',44,y,FONT(13,'bold'),C.gold);y+=24;
    for(const h of G.heroes){emo(h.st.emo,54,y,16);txt(`${h.name} · ${h.st.name}`,72,y,FONT(12,'bold'),C.ink);txt(`${h.rebirths}世 · 阵亡${h.deaths}`,W-44,y,FONT(11),C.dim,'right');y+=24}
    button(50,604,W-100,46,'再开一坛',()=>{modal=null;scene='title';newSetup()},{bg:C.gold,col:'#1a1208',font:DFONT(24)});
  }
}

// ================= 主循环与输入 =================
function render(){
  btns.length=0;
  if(scene==='title')renderTitle();else renderPlay();
  if(flash){ctx.globalAlpha=clamp(flash.t,0,1)*0.5;ctx.fillStyle=flash.col;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  const b=banners[0];
  if(b&&scene==='play'&&!modal){const a=Math.min(1,b.t/0.4,(2-b.t)/0.2);ctx.globalAlpha=Math.max(0,a);
    rr(30,130,W-60,b.sub?70:50,12);ctx.fillStyle='rgba(12,9,16,.82)';ctx.fill();
    txt(b.text,W/2,156,DFONT(28),b.col,'center');if(b.sub)txt(b.sub,W/2,184,FONT(12),C.ink,'center');ctx.globalAlpha=1}
  if(modal)renderModal();
  if(toastMsg){ctx.globalAlpha=Math.min(1,toastMsg.t*2);ctx.font=FONT(13,'bold');const w=ctx.measureText(toastMsg.s).width+28,y=AR_B-44;
    rr(W/2-w/2,y,w,28,14);ctx.fillStyle='rgba(12,9,16,.92)';ctx.fill();txt(toastMsg.s,W/2,y+14.5,FONT(13,'bold'),C.ink,'center');ctx.globalAlpha=1}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(scene==='play'&&G&&!modal){for(let k=0;k<G.speed;k++)step(dt)}
  if(banners.length){banners[0].t-=dt*(banners.length>1?1.6:1);if(banners[0].t<=0)banners.shift()}
  if(toastMsg){toastMsg.t-=dt;if(toastMsg.t<=0)toastMsg=null}
  if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
  render();requestAnimationFrame(frame);
}
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr=toLocal(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointerup',e=>{
  if(!ptr)return;const p=toLocal(e);ptr=null;
  for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x&&p.x<b.x+b.w&&p.y>=b.y&&p.y<b.y+b.h){b.fn();return}}
});
cv.addEventListener('pointercancel',()=>{ptr=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='play'&&G&&G.phase==='fight'&&!modal)modal={type:'pause'}});

window.__lh={get G(){return G},get modal(){return modal},set modal(v){modal=v},get setup(){return setup},step,newSetup,startRun,recruit,recruitDone,release,advance,gainRelic,openLunhui,lunhuiAct,buyItem,eventChoose,EVENTS,HEROES,RELICS,TUNE,rebirth,rollDao};
function boot(d){resize();newSetup();if(d&&d.heroes)loadRun(d);requestAnimationFrame(frame)}
try{window.claude?.hot?.snapshot?.(()=>serialize())}catch(_){}
const hot=window.claude?.hot;
hot?.ready?hot.ready(boot):boot(hot?.data??null);
</script>
